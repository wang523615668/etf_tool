<!doctype html>
<html lang="zh-CN">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>指数估值详情 · ETF 仪表盘</title>
  <!-- local echarts: avoid jsdelivr hang -->
  <script src="/static/vendor/echarts.min.js?v=5.5.1"></script>
  <link rel="stylesheet" href="/static/style.css?v=20260725a" />
  <style>
    .detail-toolbar {
      display: flex;
      flex-wrap: wrap;
      gap: 12px;
      align-items: center;
      justify-content: space-between;
      margin-bottom: 16px;
    }
    .detail-toolbar .controls {
      display: flex;
      flex-wrap: wrap;
      gap: 10px;
      align-items: center;
    }
    .detail-toolbar select,
    .detail-toolbar button {
      background: #131c35;
      color: #e8ecff;
      border: 1px solid #2d3b63;
      border-radius: 10px;
      padding: 8px 12px;
    }
    .detail-toolbar a.back {
      color: #69d2ff;
      text-decoration: none;
    }
    .pb-only-banner {
      display: none;
      margin: 0 0 16px;
      padding: 12px 14px;
      border-radius: 12px;
      background: rgba(245, 158, 11, 0.12);
      border: 1px solid rgba(245, 158, 11, 0.45);
      color: #ffd166;
    }
    .pb-only-banner.show { display: block; }
    .metric-row {
      display: grid;
      grid-template-columns: repeat(6, minmax(0, 1fr));
      gap: 12px;
      margin-bottom: 18px;
    }
    .metric-card {
      background: #111831;
      border: 1px solid #26304f;
      border-radius: 14px;
      padding: 14px;
    }
    .metric-card .label { color: #9aa6c7; font-size: 13px; }
    .metric-card strong { display: block; margin-top: 6px; font-size: 20px; }
    .chart-panel {
      background: #111831;
      border: 1px solid #26304f;
      border-radius: 16px;
      padding: 14px;
      margin-bottom: 16px;
    }
    .chart-panel h3 { margin: 0 0 8px; font-size: 16px; }
    .chart-panel .hint { color: #8fa0c5; font-size: 12px; margin: 0 0 10px; }
    .chart-box { width: 100%; height: 460px; }
    .chart-box.small { height: 280px; }
    .sub-tabs {
      display: flex;
      flex-wrap: wrap;
      gap: 8px;
      margin: 0 0 12px;
    }
    .sub-tab {
      background: #131c35;
      color: #c9d4f0;
      border: 1px solid #2d3b63;
      border-radius: 999px;
      padding: 6px 12px;
      cursor: pointer;
    }
    .sub-tab.active {
      background: rgba(105, 210, 255, 0.15);
      border-color: #69d2ff;
      color: #e8f7ff;
    }
    .knowledge-grid {
      display: grid;
      grid-template-columns: 1.2fr 1fr;
      gap: 14px;
      margin-bottom: 18px;
    }
    .knowledge-panel {
      background: #111831;
      border: 1px solid #26304f;
      border-radius: 16px;
      padding: 14px;
      min-height: 220px;
    }
    .knowledge-panel h3 {
      margin: 0 0 10px;
      font-size: 16px;
      display: flex;
      justify-content: space-between;
      gap: 8px;
      align-items: center;
    }
    .knowledge-panel h3 span { color: #9aa6c7; font-size: 12px; font-weight: 500; }
    .article-list, .action-list {
      display: flex;
      flex-direction: column;
      gap: 10px;
      max-height: 520px;
      overflow: auto;
    }
    .article-item, .action-item {
      background: #0d1428;
      border: 1px solid #243156;
      border-radius: 12px;
      padding: 10px 12px;
    }
    .article-item .meta, .action-item .meta {
      color: #8fa0c5;
      font-size: 12px;
      margin-bottom: 4px;
    }
    .article-item a, .action-item a {
      color: #9ad7ff;
      text-decoration: none;
      font-weight: 600;
    }
    .article-item p, .action-item p {
      margin: 6px 0 0;
      color: #b8c3e0;
      font-size: 13px;
      line-height: 1.45;
    }
    .tag-buy { color: #18c37e; }
    .tag-sell { color: #ff6b6b; }
    .tag-hold { color: #f59e0b; }
    .tag-watch { color: #69d2ff; }
    .empty-hint { color: #8fa0c5; font-size: 13px; }
    @media (max-width: 1000px) {
      .metric-row { grid-template-columns: repeat(3, minmax(0, 1fr)); }
      .knowledge-grid { grid-template-columns: 1fr; }
      .chart-box { height: 380px; }
      .chart-box.small { height: 240px; }
    }
  </style>
</head>
<body>
  <aside class="sidebar">
    <div class="brand">ETF 投资仪表盘</div>
    <a href="/">← 返回首页</a>
    <a href="/#valuation">估值温度计</a>
    <a href="/#signals">买卖提醒</a>
    <a href="/#calibration">规则校准池</a>
    <a href="/#topics">主题知识库</a>
    <a href="/index-detail?t=20260723d" style="border-top:1px solid #2d3148;margin-top:8px;padding-top:8px;color:#f59e0b">📊 指数估值详情</a>
  </aside>
  <main class="main">
    <section class="hero">
      <div>
        <h1 id="pageTitle">指数估值详情</h1>
        <p>点位 + PE + PB 叠加，并标记长赢150买卖。计数=历史全量，图上点=当前窗口可见。</p>
      </div>
      <div class="hero-card">
        <div class="muted">当前指数</div>
        <strong id="currentName">加载中…</strong>
      </div>
    </section>

    <div class="detail-toolbar">
      <a class="back" href="/">← 返回总览</a>
      <div class="controls">
        <label class="muted">指数
          <select id="indexSelect"></select>
        </label>
        <label class="muted">窗口
          <select id="windowSelect">
            <option value="3">3 年</option>
            <option value="5">5 年</option>
            <option value="10">10 年</option>
            <option value="15">15 年</option>
            <option value="20" selected>20 年（不足则取最长）</option>
          </select>
        </label>
        <button id="reloadBtn" type="button">刷新</button>
      </div>
    </div>

    <div id="pbOnlyBanner" class="pb-only-banner">红利/银行类指数 PE 分位易失真，本页以 PB 分位为主判断估值。</div>
    <div id="errorBox" class="freshness-warning"></div>
    <div id="metricRow" class="metric-row"></div>

    <section class="chart-panel">
      <h3>点位 + PE + PB 叠加 · 长赢150买卖点</h3>
      <p class="hint" id="chartHint">绿B=买入，红S=卖出；同一天多笔会合并成一个点。</p>
      <div id="overlayChart" class="chart-box"></div>
    </section>
    <section class="chart-panel">
      <h3>点位（单独）</h3>
      <div id="cpChart" class="chart-box small"></div>
    </section>
    <section class="chart-panel">
      <h3>PE 历史（单独）</h3>
      <div id="peChart" class="chart-box small"></div>
    </section>
    <section class="chart-panel">
      <h3>PB 历史（单独）</h3>
      <div id="pbChart" class="chart-box small"></div>
    </section>

    <div class="knowledge-grid">
      <section class="knowledge-panel">
        <h3>相关文章 <span id="articleMeta">—</span></h3>
        <div class="sub-tabs" id="articleSourceTabs"></div>
        <div id="articleList" class="article-list"></div>
      </section>
      <section class="knowledge-panel">
        <h3>长赢150买卖 <span id="actionMeta">—</span></h3>
        <div class="sub-tabs" id="actionSideTabs"></div>
        <div id="actionList" class="action-list"></div>
      </section>
    </div>
  </main>

  <script>
    let lastDetail = null;
    let articleSourceFilter = 'all';
    let actionSideFilter = 'all';

    function esc(v) {
      return String(v ?? '').replace(/[&<>"']/g, c => ({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
    }
    function pct(v) {
      return v == null || Number.isNaN(Number(v)) ? '-' : `${Math.round(Number(v) * 100)}%`;
    }
    function num(v, d = 2) {
      return v == null || Number.isNaN(Number(v)) ? '-' : Number(v).toFixed(d);
    }
    async function getJSON(url) {
      const r = await fetch(url);
      if (!r.ok) throw new Error(url + ' ' + r.status);
      return r.json();
    }
    function hashName() {
      const h = decodeURIComponent((location.hash || '').replace(/^#/, '')).trim();
      return h || '';
    }
    function setHash(name) {
      const next = '#' + encodeURIComponent(name);
      if (location.hash !== next) history.replaceState(null, '', next);
    }
    function makeChart(el) {
      if (typeof echarts === 'undefined' || !el) return null;
      const chart = echarts.init(el);
      window.addEventListener('resize', () => chart && chart.resize());
      return chart;
    }
    const charts = {
      overlay: makeChart(document.getElementById('overlayChart')),
      pe: makeChart(document.getElementById('peChart')),
      pb: makeChart(document.getElementById('pbChart')),
      cp: makeChart(document.getElementById('cpChart')),
    };

    function lineOption(title, dates, values, color, markPoints, extras) {
      const series = [{
        name: title,
        type: 'line',
        showSymbol: false,
        data: values,
        lineStyle: { width: 2, color },
        areaStyle: { color: color + '22' },
        itemStyle: { color },
      }];
      if (markPoints && markPoints.length) {
        series[0].markPoint = {
          symbol: 'circle',
          symbolSize: 8,
          label: { show: false },
          data: markPoints,
        };
      }
      // Extra MA lines (e.g., 850 MA, 250 MA)
      if (extras) {
        if (extras.ma850) {
          series.push({
            name: extras.ma850.name || 'MA850',
            type: 'line',
            showSymbol: false,
            data: extras.ma850.data,
            lineStyle: { width: 1.5, color: extras.ma850.color || '#ff6b6b', type: 'dashed' },
            itemStyle: { color: extras.ma850.color || '#ff6b6b' },
          });
        }
        if (extras.ma250) {
          series.push({
            name: extras.ma250.name || 'MA250',
            type: 'line',
            showSymbol: false,
            data: extras.ma250.data,
            lineStyle: { width: 1.5, color: extras.ma250.color || '#f59e0b', type: 'dotted' },
            itemStyle: { color: extras.ma250.color || '#f59e0b' },
          });
        }
      }
      return {
        backgroundColor: 'transparent',
        grid: { left: 48, right: 18, top: 36, bottom: 48 },
        tooltip: { trigger: 'axis' },
        legend: extras ? { data: [title, ...(extras.ma850 ? ['MA850'] : []), ...(extras.ma250 ? ['MA250'] : [])], textStyle: { color: '#c9d4f0' }, top: 4 } : undefined,
        dataZoom: [
          { type: 'inside', xAxisIndex: 0 },
          { type: 'slider', height: 18, bottom: 8, borderColor: '#2d3b63', fillerColor: 'rgba(105,210,255,0.12)' },
        ],
        xAxis: { type: 'category', data: dates, axisLabel: { color: '#9aa6c7' }, axisLine: { lineStyle: { color: '#2d3b63' } } },
        yAxis: { type: 'value', scale: true, axisLabel: { color: '#9aa6c7' }, splitLine: { lineStyle: { color: '#1b2544' } } },
        series,
      };
    }

    function buildCpMarkPoints(detail) {
      const rows = detail.rows || [];
      const dateIndex = new Map(rows.map((r, i) => [String(r.date || '').slice(0, 10), i]));
      const marks = detail.marks || [];
      const grouped = new Map();
      for (const m of marks) {
        const day = String(m.date || '').slice(0, 10);
        const side = m.side || m.action || '';
        if (!day || !dateIndex.has(day)) continue;
        const key = day + '|' + side;
        const g = grouped.get(key) || { day, side, count: 0, shares: 0, names: [], url: m.url, orig: m.orig_date };
        g.count += 1;
        g.shares += Number(m.shares || 0) || 0;
        if (m.name && g.names.length < 3) g.names.push(m.name);
        if (!g.url && m.url) g.url = m.url;
        grouped.set(key, g);
      }
      const out = [];
      for (const g of grouped.values()) {
        const idx = dateIndex.get(g.day);
        const isBuy = g.side === 'buy';
        const color = isBuy ? '#18c37e' : '#ff6b6b';
        const y = rows[idx] && rows[idx].cp != null ? Number(rows[idx].cp) : null;
        out.push({
          name: isBuy ? 'B' : 'S',
          coord: y == null ? [idx, 0] : [g.day, y],
          value: g.count,
          itemStyle: { color, borderColor: '#0b1020', borderWidth: 1 },
          symbol: 'circle',
          symbolSize: Math.min(8 + g.count * 2, 16),
          label: {
            show: true,
            formatter: () => (isBuy ? 'B' : 'S') + (g.count > 1 ? g.count : ''),
            color: '#fff',
            fontSize: 10,
            fontWeight: 700,
          },
          tooltip: {
            formatter: () => `${g.day}<br/>${isBuy ? '买入' : '卖出'} ${g.count} 笔`
              + (g.shares ? ` · 合计 ${g.shares} 份` : '')
              + (g.names.length ? `<br/>${g.names.join(' / ')}` : ''),
          },
        });
      }
      return out;
    }

    function overlayOption(detail) {
      const rows = detail.rows || [];
      const dates = rows.map(r => r.date);
      const cp = rows.map(r => r.cp);
      const pe = rows.map(r => r.pe);
      const pb = rows.map(r => r.pb);
      const cpMa850 = rows.map(r => r.cp_ma850);
      const cpMa250 = rows.map(r => r.cp_ma250);
      const marks = buildCpMarkPoints(detail);
      return {
        backgroundColor: 'transparent',
        animation: false,
        legend: {
          data: ['点位', 'PE', 'PB', 'MA850', 'MA250'],
          textStyle: { color: '#c9d4f0' },
          top: 4,
        },
        tooltip: {
          trigger: 'axis',
          axisPointer: { type: 'cross' },
        },
        axisPointer: { link: [{ xAxisIndex: 'all' }] },
        dataZoom: [
          { type: 'inside', xAxisIndex: [0, 1, 2] },
          { type: 'slider', xAxisIndex: [0, 1, 2], height: 18, bottom: 8, borderColor: '#2d3b63', fillerColor: 'rgba(105,210,255,0.12)' },
        ],
        grid: [
          { left: 52, right: 24, top: 42, height: '28%' },
          { left: 52, right: 24, top: '42%', height: '18%' },
          { left: 52, right: 24, top: '66%', height: '18%' },
        ],
        xAxis: [
          { type: 'category', data: dates, gridIndex: 0, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#2d3b63' } } },
          { type: 'category', data: dates, gridIndex: 1, axisLabel: { show: false }, axisLine: { lineStyle: { color: '#2d3b63' } } },
          { type: 'category', data: dates, gridIndex: 2, axisLabel: { color: '#9aa6c7' }, axisLine: { lineStyle: { color: '#2d3b63' } } },
        ],
        yAxis: [
          { type: 'value', gridIndex: 0, scale: true, name: '点位', nameTextStyle: { color: '#ffd166' }, axisLabel: { color: '#9aa6c7' }, splitLine: { lineStyle: { color: '#1b2544' } } },
          { type: 'value', gridIndex: 1, scale: true, name: 'PE', nameTextStyle: { color: '#69d2ff' }, axisLabel: { color: '#9aa6c7' }, splitLine: { lineStyle: { color: '#1b2544' } } },
          { type: 'value', gridIndex: 2, scale: true, name: 'PB', nameTextStyle: { color: '#18c37e' }, axisLabel: { color: '#9aa6c7' }, splitLine: { lineStyle: { color: '#1b2544' } } },
        ],
        series: [
          {
            name: '点位', type: 'line', xAxisIndex: 0, yAxisIndex: 0, showSymbol: false,
            data: cp, lineStyle: { width: 2, color: '#ffd166' }, itemStyle: { color: '#ffd166' },
            areaStyle: { color: 'rgba(255,209,102,0.10)' },
            markPoint: marks.length ? {
              symbol: 'circle',
              symbolSize: 10,
              data: marks,
              label: { show: true, formatter: (p) => p.name, color: '#fff', fontSize: 10 },
            } : undefined,
          },
          {
            name: 'PE', type: 'line', xAxisIndex: 1, yAxisIndex: 1, showSymbol: false,
            data: pe, lineStyle: { width: 2, color: '#69d2ff' }, itemStyle: { color: '#69d2ff' },
            areaStyle: { color: 'rgba(105,210,255,0.08)' },
          },
          {
            name: 'PB', type: 'line', xAxisIndex: 2, yAxisIndex: 2, showSymbol: false,
            data: pb, lineStyle: { width: 2, color: '#18c37e' }, itemStyle: { color: '#18c37e' },
            areaStyle: { color: 'rgba(24,195,126,0.08)' },
          },
          {
            name: 'MA850', type: 'line', xAxisIndex: 0, yAxisIndex: 0, showSymbol: false,
            data: cpMa850, lineStyle: { width: 1.5, color: '#ff6b6b', type: 'dashed' },
            itemStyle: { color: '#ff6b6b' },
          },
          {
            name: 'MA250', type: 'line', xAxisIndex: 0, yAxisIndex: 0, showSymbol: false,
            data: cpMa250, lineStyle: { width: 1.5, color: '#f59e0b', type: 'dotted' },
            itemStyle: { color: '#f59e0b' },
          },
        ],
      };
    }

    function fmtDev(v) {
      if (v == null || Number.isNaN(Number(v))) return '—';
      const n = Number(v);
      const sign = n > 0 ? '+' : '';
      return sign + n.toFixed(1) + '%';
    }
    function renderMetrics(detail) {
      const latest = detail.latest || {};
      const vis = detail.marks_visible != null ? detail.marks_visible : (detail.marks || []).length;
      const out = detail.marks_outside_window || 0;
      const md = detail.mean_deviation || {};
      const peD = md.pe || {};
      const pbD = md.pb || {};
      const peLine = peD.dev_pct != null
        ? `${fmtDev(peD.dev_pct)} <span style="color:#8fa0c5;font-size:12px">极值 ${fmtDev(peD.hist_min_pct)} ~ ${fmtDev(peD.hist_max_pct)}</span>`
        : '—';
      const pbLine = pbD.dev_pct != null
        ? `${fmtDev(pbD.dev_pct)} <span style="color:#8fa0c5;font-size:12px">极值 ${fmtDev(pbD.hist_min_pct)} ~ ${fmtDev(pbD.hist_max_pct)}</span>`
        : '—';
      const interest = md.interest_score != null
        ? `${md.interest_score} · ${esc(md.interest_level || '')}`
        : '—';

      // 双均线信号
      const daBuy = latest.double_avg_buy;
      const daNote = latest.double_avg_buy_note || '';
      const daHtml = daBuy
        ? `<strong style="color:#18c37e">✅ 双均线确认低估</strong><div class="label" style="margin-top:4px">${esc(daNote)}</div>`
        : `<strong style="color:#8fa0c5">—</strong><div class="label" style="margin-top:4px">估值未同时低于3y/5y均值</div>`;

      // 技术位
      const ts = latest.tech_signals || [];
      const cp850 = latest.cp_ma850;
      const cp250 = latest.cp_ma250;
      const techHtml = ts.length
        ? ts.map(t => `<div>• ${esc(t)}</div>`).join('')
        : '—';
      const cp850Line = cp850 != null ? num(cp850, 2) : '—';
      const cp250Line = cp250 != null ? num(cp250, 2) : '—';

      // 综合信号
      const compAction = latest.comp_action || '';
      const compReason = latest.comp_reason || '';
      const compHtml = compAction
        ? `<strong class="tag-${compAction === 'buy' ? 'buy' : compAction === 'hold' ? 'hold' : compAction === 'reduce' ? 'sell' : 'watch'}">${esc(compAction)}</strong> ${esc(compReason)}`
        : '—';

      document.getElementById('metricRow').innerHTML = `
        <div class="metric-card"><div class="label">最新日期</div><strong>${esc(latest.date || '-')}</strong></div>
        <div class="metric-card"><div class="label">PE / 分位</div><strong>${num(latest.pe)} · ${pct(latest.pe_percentile)}</strong></div>
        <div class="metric-card"><div class="label">PB / 分位</div><strong>${num(latest.pb)} · ${pct(latest.pb_percentile)}</strong></div>
        <div class="metric-card"><div class="label">PE vs 5年均值</div><strong>${peLine}</strong></div>
        <div class="metric-card"><div class="label">PB vs 5年均值</div><strong>${pbLine}</strong></div>
        <div class="metric-card"><div class="label">偏离兴趣区(本指数)</div><strong>${interest}</strong><div class="label" style="margin-top:6px">${esc(md.interest_note || '相对本指数历史正/负偏离极值')}</div></div>
        <div class="metric-card"><div class="label">点位</div><strong>${num(latest.cp, 2)}</strong></div>
        <div class="metric-card"><div class="label">双均线低估信号</div>${daHtml}</div>
        <div class="metric-card"><div class="label">850线 / 250年线</div><strong>${cp850Line}<span style="color:#8fa0c5;font-size:12px"> / ${cp250Line}</span></strong><div class="label" style="margin-top:4px">${techHtml}</div></div>
        <div class="metric-card" style="grid-column:span 2"><div class="label">综合信号（分位+均线+技术+兴趣）</div><div>${compHtml}</div></div>
        <div class="metric-card"><div class="label">相关文章</div><strong>${detail.article_count || (detail.articles || []).length || 0}</strong></div>
        <div class="metric-card"><div class="label">长赢150买卖</div><strong class="tag-buy">${detail.buy_count || 0}买</strong><span style="color:#8fa0c5"> / </span><strong class="tag-sell">${detail.sell_count || 0}卖</strong><div class="label" style="margin-top:6px">图上可见 ${vis} 点${out ? ` · 窗外 ${out}` : ''}</div></div>`;
      document.getElementById('pbOnlyBanner').classList.toggle('show', !!detail.pb_only);
      document.getElementById('currentName').textContent = `${detail.name || '-'} · ${detail.code || ''}`;
      document.getElementById('pageTitle').textContent = `${detail.name || '指数'} 详情`;
      const hint = document.getElementById('chartHint');
      if (hint) {
        const avail = detail.available_years != null ? `${detail.available_years}年` : '-';
        const span = (detail.effective_start && detail.effective_end)
          ? `${detail.effective_start} ~ ${detail.effective_end}`
          : ((detail.available_start && detail.available_end) ? `${detail.available_start} ~ ${detail.available_end}` : '-');
        const mdHint = md.interest_score != null
          ? ` · 5y偏离兴趣 ${md.interest_score}/${esc(md.interest_level||'')}`
          : '';
        hint.textContent = `绿B=买 红S=卖 · 历史共 ${(detail.buy_count||0)+(detail.sell_count||0)} 笔（${detail.buy_count||0}买/${detail.sell_count||0}卖）· 当前窗口图上 ${vis} 点`
          + (out ? ` · ${out} 笔在窗口外` : '')
          + ` · 本地最长约 ${avail}（${span}）` + mdHint;
      }
    }

    function renderCharts(detail) {
      if (typeof echarts === 'undefined') {
        document.getElementById('errorBox').className = 'freshness-warning show';
        document.getElementById('errorBox').textContent = '图表库未加载（echarts），文字数据仍可看列表';
        return;
      }
      const rows = detail.rows || [];
      const dates = rows.map(r => r.date);
      const cpMarks = buildCpMarkPoints(detail);
      if (charts.overlay) charts.overlay.setOption(overlayOption(detail), true);
      if (charts.cp) charts.cp.setOption(lineOption('点位', dates, rows.map(r => r.cp), '#ffd166', cpMarks, {
        ma850: { data: rows.map(r => r.cp_ma850), color: '#ff6b6b', name: 'MA850' },
        ma250: { data: rows.map(r => r.cp_ma250), color: '#f59e0b', name: 'MA250' },
      }), true);
      if (charts.pe) charts.pe.setOption(lineOption('PE', dates, rows.map(r => r.pe), '#69d2ff'), true);
      if (charts.pb) charts.pb.setOption(lineOption('PB', dates, rows.map(r => r.pb), '#18c37e'), true);
    }

    function renderArticles(detail) {
      const articles = detail.articles || [];
      const sources = Array.from(new Set(articles.map(a => a.source || 'other')));
      const tabs = document.getElementById('articleSourceTabs');
      const allCount = articles.length;
      const tabHtml = [`<button class="sub-tab ${articleSourceFilter === 'all' ? 'active' : ''}" data-src="all">全部 ${allCount}</button>`]
        .concat(sources.map(s => {
          const c = articles.filter(a => (a.source || 'other') === s).length;
          return `<button class="sub-tab ${articleSourceFilter === s ? 'active' : ''}" data-src="${esc(s)}">${esc(s)} ${c}</button>`;
        })).join('');
      tabs.innerHTML = tabHtml;
      tabs.querySelectorAll('.sub-tab').forEach(btn => {
        btn.onclick = () => {
          articleSourceFilter = btn.dataset.src;
          renderArticles(detail);
        };
      });
      const filtered = articles.filter(a => articleSourceFilter === 'all' || (a.source || 'other') === articleSourceFilter);
      document.getElementById('articleMeta').textContent = `${filtered.length} 篇 · 知识库 ${esc((detail.knowledge_generated_at || '').replace('T', ' ').slice(0, 16) || '-')}`;
      const list = document.getElementById('articleList');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-hint">暂无匹配文章（可换窗口或等知识库重建）</div>';
        return;
      }
      list.innerHTML = filtered.map(a => `
        <article class="article-item">
          <div class="meta">${esc(a.source || '-')} · ${esc(a.date || '无日期')} · ${esc((a.keywords || []).slice(0, 4).join(' / ') || a.id || '')}</div>
          <a href="${esc(a.url || '#')}" target="_blank" rel="noopener">${esc(a.title || '未命名')}</a>
          <p>${esc(a.excerpt || a.operation_reason || '')}</p>
        </article>`).join('');
    }

    function renderActions(detail) {
      const actions = detail.actions || [];
      const tabs = document.getElementById('actionSideTabs');
      const buyN = actions.filter(a => a.action === 'buy').length;
      const sellN = actions.filter(a => a.action === 'sell').length;
      tabs.innerHTML = `
        <button class="sub-tab ${actionSideFilter === 'all' ? 'active' : ''}" data-side="all">全部 ${actions.length}</button>
        <button class="sub-tab ${actionSideFilter === 'buy' ? 'active' : ''}" data-side="buy">买入 ${buyN}</button>
        <button class="sub-tab ${actionSideFilter === 'sell' ? 'active' : ''}" data-side="sell">卖出 ${sellN}</button>`;
      tabs.querySelectorAll('.sub-tab').forEach(btn => {
        btn.onclick = () => {
          actionSideFilter = btn.dataset.side;
          renderActions(detail);
        };
      });
      const filtered = actions.filter(a => actionSideFilter === 'all' || a.action === actionSideFilter);
      const vis = detail.marks_visible != null ? detail.marks_visible : (detail.marks || []).length;
      document.getElementById('actionMeta').textContent = `历史 ${filtered.length} 条 · 图上可见 ${vis} 点`;
      const list = document.getElementById('actionList');
      if (!filtered.length) {
        list.innerHTML = '<div class="empty-hint">当前暂无长赢150买卖记录</div>';
        return;
      }
      const markDays = new Set((detail.marks || []).map(m => String(m.date || '').slice(0, 10)));
      const markOrig = new Set((detail.marks || []).map(m => String(m.orig_date || m.date || '').slice(0, 10)));
      list.innerHTML = filtered.map(a => {
        const side = a.action === 'buy' ? '买入' : '卖出';
        const cls = a.action === 'buy' ? 'tag-buy' : 'tag-sell';
        const day = String(a.date || '').slice(0, 10);
        const onChart = markDays.has(day) || markOrig.has(day);
        const link = a.url ? `<a href="${esc(a.url)}" target="_blank" rel="noopener">原文</a>` : '';
        return `
        <div class="action-item">
          <div class="meta"><span class="${cls}">${side}</span> · ${esc(a.date || '-')} · ${esc(a.plan || '')} · ${esc(a.shares != null ? a.shares + '份' : '')} · ${onChart ? '图上✓' : '窗外/无点位'}</div>
          <div>${esc(a.name || '-')} <span class="meta">(${esc(a.code || '')})</span> ${link}</div>
          <p>${esc(a.category || '')}</p>
        </div>`;
      }).join('');
    }

    async function loadList() {
      const data = await getJSON('/api/index-list');
      const select = document.getElementById('indexSelect');
      const items = data.items || [];
      select.innerHTML = items.map(it => `<option value="${esc(it.name)}">${esc(it.name)} (${esc(it.code)})</option>`).join('');
      const preferred = hashName() || '沪深300' || (items[0] && items[0].name);
      if ([...select.options].some(o => o.value === preferred)) select.value = preferred;
      return select.value;
    }

    async function loadDetail() {
      const name = document.getElementById('indexSelect').value;
      const years = document.getElementById('windowSelect').value || '20';
      const box = document.getElementById('errorBox');
      box.className = 'freshness-warning';
      box.textContent = '';
      articleSourceFilter = 'all';
      actionSideFilter = 'all';
      try {
        const detail = await getJSON(`/api/index/${encodeURIComponent(name)}?window_years=${years}`);
        if (detail.error) throw new Error(detail.error);
        lastDetail = detail;
        setHash(name);
        renderMetrics(detail);
        renderCharts(detail);
        renderArticles(detail);
        renderActions(detail);
      } catch (err) {
        box.className = 'freshness-warning show';
        box.textContent = '加载失败：' + (err.message || err);
      }
    }

    async function boot() {
      await loadList();
      await loadDetail();
      document.getElementById('indexSelect').addEventListener('change', loadDetail);
      document.getElementById('windowSelect').addEventListener('change', loadDetail);
      document.getElementById('reloadBtn').addEventListener('click', loadDetail);
      window.addEventListener('hashchange', async () => {
        const name = hashName();
        const select = document.getElementById('indexSelect');
        if (name && select.value !== name && [...select.options].some(o => o.value === name)) {
          select.value = name;
          await loadDetail();
        }
      });
    }
    boot().catch(err => {
      document.getElementById('errorBox').className = 'freshness-warning show';
      document.getElementById('errorBox').textContent = String(err && err.stack || err);
    });
  </script>
</body>
</html>
